<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wararka - Shabeellada Hoose TV</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #12161f;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        .news-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .news-container {
                grid-template-columns: 1fr;
            }
        }
        .news-main-feed {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .news-sidebar {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .section-title {
            font-size: 20px;
            color: #1a1a1a;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background-color: #12161f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Shabeellada Hoose TV - Bogga Wararka</h1>
    </header>

    <div style="text-align: left; max-width: 1100px; margin: 0 auto;">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Ku noqo Bogga Hore</a>
    </div>

    <!-- Qeybta Guud ee Wararka iyo Baraha Bulshada -->
    <div class="news-container">
        
        <!-- Qeybta Bidix: Wararkii iyo Qoraalladii Facebook -->
        <div class="news-main-feed">
            <h3 class="section-title" style="color: #1877F2;"><i class="fab fa-facebook"></i> Wararka & Qoraallada Facebook</h3>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Halkan waxaad si toos ah uga akhrisan kartaa wararkii ugu dambeeyay ee aan ku soo bandhigno boggayaga Facebook.</p>
            
            <div style="display: flex; justify-content: center; width: 100%; overflow: hidden;">
                <iframe src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fshare%2F12KqG5v5Z5S%2F&tabs=timeline&width=500&height=500&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true&appId" width="500" height="500" style="border:none;overflow:hidden; max-width:100%;" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
            </div>
        </div>

        <!-- Qeybta Midig: Muuqaalada YouTube-ka -->
        <div class="news-sidebar">
            <h3 class="section-title" style="color: #FF0000; justify-content: center;"><i class="fab fa-youtube"></i> Muuqaalada</h3>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Daawo muuqaaladii ugu dambeeyay ee Shabeellada Hoose TV.</p>
            
            <div style="position: relative; width: 100%; height: 250px; margin-bottom: 20px;">
                <iframe style="width:100%; height:100%; border-radius: 8px; border:none;" src="https://www.youtube.com/embed/live_stream?channel=shhoosetv" allowfullscreen></iframe>
            </div>
            
            <a href="https://youtube.com/@shhoosetv?si=2z6e-Tz5_h0qY7y_" target="_blank" style="display: block; background: #FF0000; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600;">
                <i class="fab fa-youtube"></i> Booqo Kanaalka YouTube
            </a>
        </div>

    </div>

</body>
</html>
