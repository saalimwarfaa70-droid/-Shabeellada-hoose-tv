<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gal Account-ka - Shabeellada Hoose TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B132B',
                        darkNavy: '#050B14',
                        gold: '#D4AF37'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center h-screen">

    <div class="max-w-md w-full p-6 bg-darkNavy rounded-xl border border-gold/30 shadow-lg">
        <h2 class="text-2xl font-bold text-gold mb-6 text-center">Maamulka Shabeellada Hoose TV</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-300 mb-1">Email-kaaga</label>
                <input type="email" id="email" required class="w-full p-3 bg-gray-800 border border-gold/20 rounded text-white focus:outline-none focus:border-gold">
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Password-ka</label>
                <input type="password" id="password" required class="w-full p-3 bg-gray-800 border border-gold/20 rounded text-white focus:outline-none focus:border-gold">
            </div>
            <button type="submit" class="w-full bg-gold text-darkNavy py-3 rounded font-bold hover:bg-yellow-500 transition">Gal</button>
        </form>
        
        <p id="errorMsg" class="text-red-500 text-sm mt-4 text-center hidden"></p>
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs text-gold underline">Ku noqo Bogga Hore</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ihvimmiazbupeombpotb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fZEhm83WNjr_wDenqZD37Q_ztvSuepv';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.textContent = "Khalad: " + error.message;
                errorMsg.classList.remove('hidden');
            } else {
                alert("Si guul leh ayuu kuu geliyay!");
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
